[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mosaic-governed-enterprise-intake"
version = "0.1.0"
description = "A synthetic, governed enterprise intake-to-decision workflow for GitHub Copilot App."
requires-python = ">=3.12"
license = "LicenseRef-MOSAIC-Evaluation"
license-files = ["LICENSE", "NOTICE.md", "templates/lucide-LICENSE"]
dependencies = [
    "jsonschema>=4.23,<5",
    "json5>=0.12,<1",
    "rfc3339-validator>=0.1.4,<1",
    "jinja2>=3.1.6,<4",
    "markdown-it-py>=3,<5",
]

[project.scripts]
mosaic = "mosaic.cli:main"
mosaic-mcp = "mosaic.mcp_server:main"
mosaic-jobs = "mosaic.jobs:main"

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.8", "PyYAML>=6,<7"]
mcp = ["mcp>=2.0,<3"]
windows = ["windows-toasts>=1.3.1,<2; sys_platform == 'win32'"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "D100", "D104"]

[tool.ruff.lint.per-file-ignores]
"src/mosaic/render.py" = ["E501"]
"src/mosaic/reports.py" = ["E501"]
